services:
  - type: web
    name: pricematcher
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: APP_ENV
        value: production
      - key: PERSISTENCE_BACKEND
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: PRICE_MATCHER_SESSION_SECRET
        sync: false
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
